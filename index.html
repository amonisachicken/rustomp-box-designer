<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- 本地开发不留缓存：改了 src/*.js 刷新即生效（python http.server 不发 cache 头） -->
    <meta http-equiv="cache-control" content="no-store" />
    <title>rustomp-box-designer</title>
    <style>
      :root {
        --ink: #231815;
        --cream: #faf1e0;
        --line: #d8cdb8;
        --accent: #b4531c;
        --bg: #2a2523;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template-rows: auto 1fr auto;
        grid-template-columns: 200px 1fr 260px;
        grid-template-areas: "top top top" "lib canvas insp" "status status status";
        font: 13px/1.5 -apple-system, "Helvetica Neue", "PingFang SC", sans-serif;
        color: var(--ink);
        background: #efe7d8;
        overflow: hidden;
      }
      button, select, input {
        font: inherit;
        color: inherit;
        border: 1px solid var(--line);
        background: #fffdf8;
        border-radius: 4px;
        padding: 3px 6px;
      }
      button { cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
      #top { grid-area: top; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--bg); color: #f6efe2; }
      #top .spacer { flex: 1; }
      #top input[type="text"] { width: 160px; background: #3b3532; color: #f6efe2; border-color: #4d4643; }
      /* 顶栏按钮：浅底 + 深字（继承 top 的浅色文字会看不见） */
      #top button { background: #f6efe2; color: var(--ink); border-color: #8a7f74; }
      #top button:hover { background: #fffdf8; border-color: var(--accent); }
      #top button.on, #top #mode button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
      #top button.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }
      #top button.primary:hover { background: #3a3230; }
      #mode { display: flex; gap: 0; }
      #mode button { border-radius: 0; }
      #mode button:first-child { border-radius: 4px 0 0 4px; }
      #mode button:last-child { border-radius: 0 4px 4px 0; }
      #mode button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

      #lib {
        grid-area: lib; display: flex; flex-direction: column; overflow: hidden;
        background: #f6efe2; border-right: 1px solid var(--line); padding: 8px;
      }
      /* 素材多的时候让素材区自己滚，图层列表钉在底部（否则图层会被 32 个素材挤下去） */
      #assetList { flex: 1 1 auto; overflow-y: auto; min-height: 0; }
      #layerList { flex: 0 0 auto; border-top: 1px solid var(--line); padding-top: 4px; }
      #importBar { flex: 0 0 auto; padding: 6px 0 4px; }
      #importBar button { width: 100%; }
      /* 导入素材的缩略图：直接内联 SVG，避免额外请求 */
      .asset .thumb { width: 100%; height: 34px; display: flex; align-items: center; justify-content: center; }
      .asset .thumb svg { max-width: 100%; max-height: 34px; }
      .layer {
        display: flex; align-items: center; gap: 4px; padding: 2px 6px; border-radius: 4px;
        font-size: 12px; color: #4a423b; cursor: pointer;
      }
      .layer:hover { background: #fffdf8; }
      .layer .name { flex: 1; }
      .layer button { padding: 0 4px; border: none; background: none; font-size: 13px; opacity: 0.55; }
      .layer button.on { opacity: 1; }
      .layer.off .name { opacity: 0.4; text-decoration: line-through; }
      /* 焦点图层：高亮；其余图层在画布与素材库里虚化 */
      .layer.focus { background: #f6e3d2; box-shadow: inset 2px 0 0 var(--accent); }
      .layer.focus .name { font-weight: 600; }
      .asset.dimmed { opacity: 0.28; pointer-events: none; filter: grayscale(1); }
      #lib h3 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 0.08em; color: #7a6f63; text-transform: uppercase; }
      #lib h3:first-child { margin-top: 0; }
      .asset-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      .asset {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        padding: 6px 4px; border: 1px solid var(--line); border-radius: 5px; background: #fffdf8;
        cursor: pointer; font-size: 10px; color: #6b6156;
      }
      .asset:hover { border-color: var(--accent); color: var(--accent); }
      .asset { min-width: 0; }
      .asset img { width: 100%; max-width: 100%; height: 34px; object-fit: contain; }
      .asset span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .asset.wide img { height: 20px; }

      #canvasWrap { grid-area: canvas; display: grid; place-items: center; padding: 14px; overflow: hidden; }
      #stage { position: relative; box-shadow: 0 6px 30px rgba(0, 0, 0, 0.25); background: #fff; }
      #stage svg { display: block; width: 100%; height: 100%; }
      #stage .sel { fill: none; stroke: var(--accent); stroke-width: 0.35; stroke-dasharray: 1.2 0.8; }
      #stage .grid line { stroke: #3a3a3a; stroke-width: 0.06; opacity: 0.16; }
      #stage .safe { fill: none; stroke: #b4531c; stroke-width: 0.18; stroke-dasharray: 1.6 1.2; opacity: 0.55; }
      #stage .guide { stroke: #1f7ac0; stroke-width: 0.12; opacity: 0.8; }
      .drag { cursor: move; }
      body.preview #stage .drag { cursor: default; }

      #insp { grid-area: insp; overflow: auto; background: #f6efe2; border-left: 1px solid var(--line); padding: 8px; }
      #insp h3 { margin: 10px 0 6px; font-size: 11px; letter-spacing: 0.08em; color: #7a6f63; text-transform: uppercase; }
      #insp h3:first-child { margin-top: 0; }
      .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
      .row label { flex: 0 0 78px; color: #6b6156; font-size: 12px; }
      .row input, .row select { flex: 1; min-width: 0; }
      .row input[type="number"] { text-align: right; }
      .warn { color: #a3341c; font-size: 12px; }
      .ok { color: #2f6b3a; font-size: 12px; }
      #problems { margin: 4px 0 0; padding-left: 16px; }
      #problems li { font-size: 11.5px; color: #a3341c; }
      textarea { width: 100%; height: 120px; font: 11px/1.45 ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 6px; background: #fffdf8; }
      #status { grid-area: status; display: flex; gap: 14px; padding: 4px 10px; background: var(--bg); color: #cfc4b6; font-size: 11.5px; }
      #status b { color: #f6efe2; font-weight: 600; }
      dialog { border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: #fbf6ea; color: var(--ink); max-width: 520px; }
      dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
      dialog h2 { margin: 0 0 8px; font-size: 15px; }
      dialog code { display: block; background: #2a2523; color: #f6efe2; padding: 8px; border-radius: 4px; margin: 8px 0; font-size: 11.5px; overflow-x: auto; }
    </style>
  </head>
  <body>
    <div id="top">
      <strong style="letter-spacing: 0.04em">box-designer</strong>
      <input id="docName" type="text" placeholder="面板名称" title="去 .box.json 里的 name" />
      <div id="mode">
        <button data-mode="edit" class="on" title="拖动移动元素（Tab 切换）">编辑</button>
        <button data-mode="preview" title="拖旋钮 / 点拨杆 / 按脚踏">预览</button>
      </div>
      <span class="spacer"></span>
      <button id="btnUndo" title="撤销（⌘Z）">↶</button>
      <button id="btnRedo" title="重做（⇧⌘Z）">↷</button>
      <button id="btnNew" title="新建空白面板">新建</button>
      <button id="btnOpen" title="打开 .box.json（或 rustomp.toml 读参数）">打开</button>
      <button id="btnSave" title="下载 .box.json 到本地">保存</button>
      <button id="btnStash" title="暂存到本地服务端（./scripts/dev.sh）；下次打开自动恢复">暂存</button>
      <button id="btnExport" class="primary" title="导出 ui.toml / panel.svg；PNG 由 CLI 栅格化">导出</button>
    </div>

    <aside id="lib">
      <div id="assetList"></div>
      <div id="importBar">
        <button id="btnImport" title="导入外部 SVG（需手动指定：装饰 / 丝印）">＋ 导入 SVG…</button>
      </div>
      <h3>图层 <span style="font-weight:400;letter-spacing:0;text-transform:none;color:#8a7f74">（点名字聚焦）</span></h3>
      <div id="layerList"></div>
    </aside>
    <main id="canvasWrap"><div id="stage"></div></main>
    <aside id="insp"></aside>
    <div id="status">
      <span>坐标 <b id="stCursor">–</b></span>
      <span>元素 <b id="stCount">0</b></span>
      <span>画布 <b id="stCanvas">–</b></span>
      <span>密度 <b id="stDensity">–</b></span>
      <span class="spacer" style="flex: 1"></span>
      <span id="stHint">点素材添加 · 拖动移动 · 方向键微调 · ⌫ 删除 · Tab 切模式</span>
    </div>

    <dialog id="dlgExport">
      <h2>导出</h2>
      <p id="expSummary"></p>
      <p>
        <button id="expZip" class="primary" title="ui.toml + panel.svg + panel.png + 全部贴图 + 设计文件">⬇ 下载素材包（zip）</button>
      </p>
      <p style="font-size:11.5px;color:#6b6156">或者单件下载：<button id="expToml">ui.toml</button> <button id="expSvg">panel.svg</button></p>
      <p style="margin-bottom: 4px">素材包里的 PNG 由浏览器 canvas 栅格化（12 px/mm）；若想要 Inkscape 出的"权威"版本，跑 CLI：</p>
      <code id="expCmd"></code>
      <p id="expProblems" class="warn"></p>
      <p style="text-align: right"><button id="expClose">关闭</button></p>
    </dialog>

    <input id="fileInput" type="file" accept=".json,.toml" hidden />
    <input id="svgInput" type="file" accept=".svg,image/svg+xml" multiple hidden />
    <dialog id="dlgImport">
      <h2>导入 SVG 素材</h2>
      <p id="impList" style="font-size:12px;color:#6b6156"></p>
      <p>这些素材属于哪一层？（控件层只能用内置素材）</p>
      <div style="display:flex;gap:14px;margin:10px 0 14px">
        <label><input type="radio" name="impKind" value="artwork" checked /> 装饰层 artwork</label>
        <label><input type="radio" name="impKind" value="silkscreen" /> 丝印层 silkscreen</label>
      </div>
      <p style="text-align:right"><button id="impCancel">取消</button> <button id="impOk" class="primary">导入</button></p>
    </dialog>
    <script>
      // 出错时把信息显示在状态栏，而不是只在控制台里（本地调试很需要）
      addEventListener("error", (e) => {
        const el = document.getElementById("stHint");
        if (el) el.textContent = `⚠ ${e.message}（${e.filename?.split("/").pop()}:${e.lineno}）`;
      });
      addEventListener("unhandledrejection", (e) => {
        const el = document.getElementById("stHint");
        if (el) el.textContent = `⚠ ${e.reason?.message ?? e.reason}`;
      });
    </script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
